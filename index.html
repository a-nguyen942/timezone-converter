<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Converter</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="screen">
    <div class="time-card time-card-left">
        <div class="location-search-bar">
          <div class="search-bar search-bar-country">Country</div>
          <div class="location-search-divider" aria-hidden="true"></div>
          <div class="search-bar search-bar-city">City</div>
        </div>
        <div class="country-row">
          <div class="country-initials"></div>
          <div class="country"></div>
        </div>
        <div class="city"></div>
        <div class="timezone"><span class="timezone-abbreviation"></span></div>
        <div class="time"><span class="period"></span></div>
        <div class="date"></div>
    </div>
    <div class="divider" aria-hidden="true"></div>
    <div class="time-card time-card-right">
        <div class="location-search-bar">
          <div class="search-bar search-bar-country">Country</div>
          <div class="location-search-divider" aria-hidden="true"></div>
          <div class="search-bar search-bar-city">City</div>
        </div>
        <div class="country-row">
          <div class="country-initials"></div>
          <div class="country"></div>
        </div>
        <div class="city"></div>
        <div class="timezone"><span class="timezone-abbreviation"></span></div>
        <div class="time"><span class="period"></span></div>
        <div class="date"></div>
    </div>
  </div>
</body>
</html>
