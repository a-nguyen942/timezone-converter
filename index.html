<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Converter</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="screen">
    <div class="time-card time-card-left">
        <div class="location-search-bar">
          <div class="search-wrapper country-search-wrapper">
            <input class="search-bar search-bar-country" type="search" placeholder="Country" aria-label="Search for a country" autocomplete="off">
            <button class="clear-search-btn" aria-label="Clear input" type="button" tabindex="-1">×</button>
            <div class="country-recommendations" role="listbox" hidden>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
            </div>
          </div>
          <div class="location-search-divider" aria-hidden="true"></div>
          <div class="search-wrapper city-search-wrapper">
            <input class="search-bar search-bar-city" type="search" placeholder="City" aria-label="Search for a city" autocomplete="off">
            <button class="clear-search-btn" aria-label="Clear input" type="button" tabindex="-1">×</button>
            <div class="city-recommendations" role="listbox" hidden>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
            </div>
          </div>
        </div>
        <div class="country-row">
          <div class="country-initials"></div>
          <div class="country"></div>
        </div>
        <div class="city"><span class="city-placeholder"></span></div>
        <div class="timezone"><span class="timezone-abbreviation"></span></div>
        <div class="time"><span class="period"></span></div>
        <div class="date-row">
          <div class="date"></div>
          <div class="custom-time-date">Edit time</div>
        </div>
        <div class="weather">
          <div class="weather-status"></div>
          <div class="weather-icon"></div>
          <div class="actual-temperature"></div>
          <div class="apparent-temperature"></div>
          <div class="wind-speed"></div>
        </div>
    </div>
    <div class="divider">
      <button class="swap-button" type="button" aria-label="Swap time cards">⇄</button>
    </div>
    <div class="time-card time-card-right">
        <div class="location-search-bar">
          <div class="search-wrapper country-search-wrapper">
            <input class="search-bar search-bar-country" type="search" placeholder="Country" aria-label="Search for a country" autocomplete="off">
            <button class="clear-search-btn" aria-label="Clear input" type="button" tabindex="-1">×</button>
            <div class="country-recommendations" role="listbox" hidden>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
              <button class="country-recommendation" type="button" role="option"></button>
            </div>
          </div>
          <div class="location-search-divider" aria-hidden="true"></div>
          <div class="search-wrapper city-search-wrapper">
            <input class="search-bar search-bar-city" type="search" placeholder="City" aria-label="Search for a city" autocomplete="off">
            <button class="clear-search-btn" aria-label="Clear input" type="button" tabindex="-1">×</button>
            <div class="city-recommendations" role="listbox" hidden>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
              <button class="city-recommendation" type="button" role="option"></button>
            </div>
          </div>
        </div>
        <div class="country-row">
          <div class="country-initials"></div>
          <div class="country"></div>
        </div>
        <div class="city"><span class="city-placeholder"></span></div>
        <div class="timezone"><span class="timezone-abbreviation"></span></div>
        <div class="time"><span class="period"></span></div>
        <div class="date"></div>
        <div class="weather">
          <div class="weather-status"></div>
          <div class="weather-icon"></div>
          <div class="actual-temperature"></div>
          <div class="apparent-temperature"></div>
          <div class="wind-speed"></div>
        </div>
    </div>
  </div>
</body>
</html>
